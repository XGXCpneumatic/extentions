# Builds the download site: zips each extension and publishes site/ to GitHub Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site and zip extensions
        run: |
          mkdir -p _site/downloads
          cp -r site/. _site/
          # Extensions offered for download (add new ones here).
          for ext in bamboo-panda web-bingo find-pip longest-word-tracker page-flipper; do
            (cd "$ext" && zip -r -q "../_site/downloads/$ext.zip" .)
          done
          ls -la _site/downloads

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
